name: BodyOps
options:
  bundleIdPrefix: com.bodyops
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  BodyOps:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BodyOps
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bodyops.app
        INFOPLIST_FILE: BodyOps/Resources/Info.plist
        # iPhone専用（縦向きのみ対応のため。ユニバーサルだとiPadマルチタスク要件で
        # 全向き対応が必須になり、App Storeアップロードが弾かれる）
        TARGETED_DEVICE_FAMILY: "1"
        # Apple Developer Team ID（xcodegen再生成でXcode上の署名設定が消えないようここに固定）
        DEVELOPMENT_TEAM: "9472GD6P88"
        SWIFT_EMIT_LOC_STRINGS: YES
        # FoundationModels(iOS 26+)は #if canImport + @available ガードにより
        # iOS 26 SDKビルド時に自動でweak linkされる（明示フラグは旧SDKでリンクエラーになるため付けない）
    entitlements:
      path: BodyOps/Resources/BodyOps.entitlements

  BodyOpsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BodyOpsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bodyops.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BodyOps.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BodyOps"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: BodyOps
